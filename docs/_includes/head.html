<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  {%- if page.mermaid -%}
  <script type="module">
  import mermaid from '/assets/js/mermaid-11-10-0.esm.min.mjs';
  mermaid.initialize({ startOnLoad: true });
  mermaid.run({
      querySelector: '.language-mermaid',
  });
  </script>
  {%- endif -%}
  {%- if page.asciinema -%}
  <link rel="stylesheet" type="text/css" href="{{ "/assets/css/asciinema-player.css" | relative_url }}">
  <script src="{{ "/assets/js/asciinema-player.min.js" | relative_url }}" async></script>
  {%- endif -%}
  {%- if site.darkmode -%}
  <link rel="stylesheet" type="text/css" href="{{ "/assets/darkmode.css" | relative_url }}">
  {%- endif -%}
</head>
